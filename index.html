<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>泳装企业CRM系统</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 20px;
            }

            .container {
                max-width: 1200px;
                margin: 0 auto;
                background: white;
                border-radius: 15px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
                overflow: hidden;
            }

            .header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 30px;
                text-align: center;
            }

            .header h1 {
                font-size: 2.5rem;
                margin-bottom: 10px;
                font-weight: 300;
            }

            .header p {
                opacity: 0.9;
                font-size: 1.1rem;
            }

            .search-bar {
                padding: 20px 30px;
                background: #f8f9fa;
                border-bottom: 1px solid #e9ecef;
            }

            .search-container {
                position: relative;
                display: flex;
                gap: 15px;
                align-items: center;
            }

            .search-input-wrapper {
                position: relative;
                flex: 1;
            }

            .search-input {
                width: 100%;
                padding: 12px 45px 12px 20px;
                border: 2px solid #e9ecef;
                border-radius: 25px;
                font-size: 16px;
                outline: none;
                transition: all 0.3s ease;
                background: white;
            }

            .search-input:focus {
                border-color: #667eea;
                box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            }

            .search-clear {
                position: absolute;
                right: 15px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                color: #6c757d;
                cursor: pointer;
                font-size: 18px;
                padding: 5px;
                border-radius: 50%;
                display: none;
                transition: all 0.3s ease;
            }

            .search-clear:hover {
                background: #f8f9fa;
                color: #495057;
            }

            .search-clear.show {
                display: block;
            }

            .search-results-info {
                padding: 10px 30px;
                background: #e3f2fd;
                border-bottom: 1px solid #bbdefb;
                color: #1976d2;
                font-size: 14px;
                display: none;
            }

            .search-results-info.show {
                display: block;
            }

            .table-container {
                overflow-x: auto;
                padding: 0 30px;
            }

            .company-table {
                width: 100%;
                border-collapse: collapse;
                margin: 20px 0;
            }

            .company-table th {
                background: #f8f9fa;
                padding: 18px 20px;
                text-align: left;
                font-weight: 600;
                color: #495057;
                border-bottom: 2px solid #e9ecef;
            }

            .company-table td {
                padding: 18px 20px;
                border-bottom: 1px solid #e9ecef;
                cursor: pointer;
                transition: all 0.3s ease;
                line-height: 1.6;
            }

            /* 状态列宽度控制 */
            .company-table th:nth-child(4),
            .company-table td:nth-child(4) {
                width: 80px;
                max-width: 80px;
            }

            /* 操作列宽度控制 */
            .company-table th:nth-child(5),
            .company-table td:nth-child(5) {
                width: 80px;
                max-width: 80px;
                text-align: center;
            }

            .company-table tr:hover {
                background: #f8f9fa;
                transform: translateY(-1px);
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }

            .status-badge {
                padding: 3px 6px;
                border-radius: 12px;
                font-size: 10px;
                font-weight: 600;
                text-align: center;
                display: inline-block;
                min-width: 50px;
                white-space: nowrap;
            }

            .status-unvisited {
                background: #ffeaa7;
                color: #d63031;
            }
            .status-visited {
                background: #74b9ff;
                color: white;
            }
            .status-rejected {
                background: #fd79a8;
                color: white;
            }
            .status-cooperating {
                background: #00b894;
                color: white;
            }
            .status-signed {
                background: #6c5ce7;
                color: white;
            }

            /* 模态框样式 */
            .modal {
                display: none;
                position: fixed;
                z-index: 1000;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(5px);
            }

            .modal-content {
                background-color: white;
                margin: 5% auto;
                padding: 0;
                border-radius: 15px;
                width: 90%;
                max-width: 600px;
                max-height: 90vh;
                overflow-y: auto;
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
                animation: modalSlideIn 0.3s ease;
            }

            @keyframes modalSlideIn {
                from {
                    transform: translateY(-50px);
                    opacity: 0;
                }
                to {
                    transform: translateY(0);
                    opacity: 1;
                }
            }

            .modal-header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 25px;
                border-radius: 15px 15px 0 0;
                position: relative;
            }

            .modal-header h2 {
                margin: 0;
                font-size: 1.5rem;
                font-weight: 300;
            }

            .close {
                position: absolute;
                right: 20px;
                top: 20px;
                color: white;
                font-size: 28px;
                font-weight: bold;
                cursor: pointer;
                width: 35px;
                height: 35px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s ease;
            }

            .close:hover {
                background: rgba(255, 255, 255, 0.2);
            }

            .modal-body {
                padding: 30px;
            }

            .detail-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                margin-bottom: 30px;
            }

            .detail-item {
                background: #f8f9fa;
                padding: 15px;
                border-radius: 10px;
                border-left: 4px solid #667eea;
            }

            .detail-label {
                font-weight: 600;
                color: #495057;
                margin-bottom: 5px;
                font-size: 14px;
            }

            .detail-value {
                color: #212529;
                font-size: 16px;
            }

            .phone-link {
                color: #667eea;
                text-decoration: none;
                font-weight: 600;
                transition: all 0.3s ease;
            }

            .phone-link:hover {
                color: #764ba2;
                text-decoration: underline;
            }

            .phone-numbers {
                line-height: 1.8;
            }

            .phone-numbers .phone-link {
                display: inline-block;
                margin: 2px 0;
                padding: 2px 0;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .form-label {
                display: block;
                margin-bottom: 8px;
                font-weight: 600;
                color: #495057;
            }

            .form-control {
                width: 100%;
                padding: 12px;
                border: 2px solid #e9ecef;
                border-radius: 8px;
                font-size: 16px;
                transition: all 0.3s ease;
            }

            .form-control:focus {
                outline: none;
                border-color: #667eea;
                box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            }

            .btn {
                padding: 12px 24px;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                margin-right: 10px;
            }

            .btn-primary {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
            }

            .btn-secondary {
                background: #6c757d;
                color: white;
            }

            .btn-secondary:hover {
                background: #5a6268;
            }

            /* 移动端适配 */
            @media (max-width: 768px) {
                body {
                    padding: 10px;
                }

                .header h1 {
                    font-size: 2rem;
                }

                .header p {
                    font-size: 1rem;
                }

                /* 搜索栏移动端适配 */
                .search-bar {
                    padding: 15px 20px;
                }

                .search-container {
                    flex-direction: column;
                    gap: 12px;
                    align-items: stretch;
                }

                .search-input-wrapper {
                    width: 100%;
                }

                .search-input {
                    font-size: 16px; /* 防止iOS缩放 */
                    padding: 14px 45px 14px 20px;
                }

                .search-results-info {
                    padding: 8px 20px;
                    font-size: 13px;
                }

                .table-container {
                    padding: 0 15px;
                }

                .company-table th,
                .company-table td {
                    padding: 10px 8px;
                    font-size: 14px;
                }

                .detail-grid {
                    grid-template-columns: 1fr;
                    gap: 15px;
                }

                .modal-content {
                    margin: 10% auto;
                    width: 95%;
                }

                .modal-body {
                    padding: 20px;
                }

                .btn {
                    width: 100%;
                    margin-bottom: 10px;
                    margin-right: 0;
                }
            }

            @media (max-width: 480px) {
                body {
                    padding: 5px;
                }

                .header h1 {
                    font-size: 1.8rem;
                }

                .header p {
                    font-size: 0.9rem;
                }

                /* 小屏幕搜索栏优化 */
                .search-bar {
                    padding: 12px 15px;
                }

                .search-container {
                    gap: 10px;
                }

                .search-input {
                    padding: 12px 40px 12px 16px;
                    font-size: 16px;
                    border-radius: 20px;
                }

                .search-clear {
                    right: 12px;
                    font-size: 16px;
                }

                .search-results-info {
                    padding: 6px 15px;
                    font-size: 12px;
                }

                .company-table {
                    font-size: 12px;
                }

                .company-table th:nth-child(3),
                .company-table td:nth-child(3) {
                    display: none;
                }

                .company-table th,
                .company-table td {
                    padding: 8px 6px;
                }
            }

            /* 加载动画 */
            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

                    </div>
                    <button class="btn btn-primary" onclick="showAddModal()" style="white-space: nowrap">
                        新增企业
                    </button>
                </div>
            </div>

            <!-- 搜索结果信息 -->
            <div class="search-results-info" id="searchResultsInfo">
                找到 <span id="searchResultsCount">0</span> 条匹配结果
            </div>

            <!-- 加载状态 -->

                    style="
                        display: inline-block;
                        width: 20px;
                        height: 20px;
                        border: 3px solid #f3f3f3;
                        border-top: 3px solid #007bff;
                        border-radius: 50%;
                        animation: spin 1s linear infinite;
                        margin-right: 10px;
                    "

                正在加载数据...
            </div>

            <div class="table-container">
                <table class="company-table" id="companyTable">
                    <thead>
                        <tr>
                            <th>企业名称</th>
                            <th>类型</th>
                            <th>联系电话</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- 数据将通过JavaScript动态加载 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 详细信息模态框 -->
        <div id="detailModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">企业详细信息</h2>
                    <span class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="detail-grid" id="detailGrid">
                        <!-- 详细信息将动态加载 -->
                    </div>

                    <div class="form-group">
                        <label class="form-label">拜访状态</label>
                        <select class="form-control" id="statusSelect">
                            <option value="1">未拜访</option>
                            <option value="2">已拜访</option>
                            <option value="3">已拒绝</option>
                            <option value="4">已合作</option>
                            <option value="5">已签单</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">回访记录</label>
                        <textarea
                            class="form-control"
                            id="visitNotes"
                            rows="4"
                            placeholder="请输入回访记录..."
                        ></textarea>
                    </div>

                    <div style="text-align: right; margin-top: 30px">
                        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                        <button class="btn btn-primary" onclick="saveRecord()">保存</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 新增企业模态框 -->
        <div id="addModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>新增企业</h2>
                    <span class="close" onclick="closeAddModal()">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">企业名称 *</label>
                        <input type="text" class="form-control" id="addName" placeholder="请输入企业名称" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">类型 *</label>
                        <select class="form-control" id="addType">
                            <option value="成衣">成衣</option>
                            <option value="面料">面料</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">联系电话 *</label>
                        <input type="text" class="form-control" id="addPhone" placeholder="请输入联系电话" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">地址</label>
                        <input type="text" class="form-control" id="addAddress" placeholder="请输入地址" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">行业</label>
                        <input
                            type="text"
                            class="form-control"
                            id="addIndustry"
                            placeholder="请输入行业"
                            value="泳装相关"
                        />
                    </div>

                    <div class="form-group">
                        <label class="form-label">企业规模</label>
                        <input type="text" class="form-control" id="addScale" placeholder="请输入企业规模" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">注册资本</label>
                        <input type="text" class="form-control" id="addCapital" placeholder="请输入注册资本" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">成立日期</label>
                        <input type="date" class="form-control" id="addRegistration" />
                    </div>

                    <div style="text-align: right; margin-top: 30px">
                        <button class="btn btn-secondary" onclick="closeAddModal()">取消</button>
                        <button class="btn btn-primary" onclick="addCompany()">保存</button>
                    </div>
                </div>
            </div>
        </div>

            // 显示加载状态

                if (loadingEl) {
                    loadingEl.style.display = show ? 'block' : 'none';
                }

            // API请求封装
            async function apiRequest(url, options = {}) {
                try {
                    showLoading(true);
                    const response = await fetch(url, {
                        headers: {
                            'Content-Type': 'application/json',
                            ...options.headers,
                        },
                        ...options,
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    return data;
                } catch (error) {
                    console.error('API请求失败:', error);
                    throw error;
                } finally {
                    showLoading(false);
                }
            }

            // 从API加载数据
            async function loadData(forceRefresh = false) {
                try {
                    // 如果有缓存且不强制刷新，直接返回缓存数据
                    if (cachedCompanies && !forceRefresh) {
                        window.companiesData = cachedCompanies;
                        return cachedCompanies;
                    }

                    const data = await apiRequest(`${API_CONFIG.baseUrl}${API_CONFIG.endpoints.data}`);

                    // 如果API返回空数据，使用默认数据并保存到API
                    if (!data || data.length === 0) {
                        await saveData(companyData);
                        cachedCompanies = companyData;
                        window.companiesData = companyData;
                        lastDataLoadTime = Date.now();
                        return companyData;
                    }

                    // 更新缓存和全局数据
                    cachedCompanies = data;
                    window.companiesData = data;
                    lastDataLoadTime = Date.now();
                    return data;
                } catch (error) {
                    console.error('加载数据失败，使用本地数据:', error);
                    // 如果API失败，尝试从localStorage获取备份数据
                    const savedData = localStorage.getItem('crmData');
                    if (savedData) {
                        const parsedData = JSON.parse(savedData);
                        cachedCompanies = parsedData;
                        window.companiesData = parsedData;
                        lastDataLoadTime = Date.now();
                        return parsedData;
                    }
                    cachedCompanies = companyData;
                    window.companiesData = companyData;
                    lastDataLoadTime = Date.now();
                    return companyData;
                }
            }

            // 保存数据到API

                    // 同时保存到localStorage作为备份
                    localStorage.setItem('crmData', JSON.stringify(data));

                    return true;
                } catch (error) {
                    console.error('保存数据失败:', error);
                    // 如果API失败，至少保存到localStorage
                    localStorage.setItem('crmData', JSON.stringify(data));
                    throw error;

            // 搜索功能
            // 搜索防抖定时器
            let searchDebounceTimer = null;

            function setupSearch() {
                const searchInput = document.getElementById('searchInput');
                const searchClear = document.getElementById('searchClear');

                if (!searchInput || !searchClear) {
                    console.error('搜索元素未找到');
                    return;
                }

                // 搜索输入事件（带防抖）
                searchInput.addEventListener('input', (e) => {
                    const searchTerm = e.target.value.trim();

                    // 显示/隐藏清空按钮
                    if (searchTerm) {
                        searchClear.classList.add('show');
                    } else {
                        searchClear.classList.remove('show');
                    }

                    // 防抖处理
                    clearTimeout(searchDebounceTimer);
                    searchDebounceTimer = setTimeout(() => {
                        performSearch(searchTerm);
                    }, 300);
                });

                // 清空搜索
                searchClear.addEventListener('click', () => {
                    searchInput.value = '';
                    searchClear.classList.remove('show');
                    hideSearchResults();
                    // 清空搜索时显示所有数据
                    const dataToShow = window.companiesData || cachedCompanies || companyData;
                    renderTable(dataToShow);
                });

                // 回车键搜索
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        clearTimeout(searchDebounceTimer);
                        performSearch(e.target.value.trim());
                    }
                });

                // 初始化时确保数据可用
                if (!window.companiesData && !cachedCompanies) {
                    window.companiesData = companyData;
                    console.log('搜索功能初始化：使用默认数据');
                }
            }

            // 执行搜索

                try {
                    // 确保有数据可搜索，优先使用缓存数据，然后是本地数据
                    let dataToSearch = window.companiesData || cachedCompanies || companyData;

                    if (!dataToSearch || dataToSearch.length === 0) {
                        console.log('没有可搜索的数据，使用默认数据');
                        dataToSearch = companyData;
                        window.companiesData = companyData;
                    }

                    if (searchTerm === '') {
                        hideSearchResults();
                        renderTable(dataToSearch);
                        return;
                    }

                    const filtered = dataToSearch.filter((company) => {
                        const name = (company.name || '').toLowerCase();
                        const phone = (company.phone || '').toLowerCase();
                        const address = (company.address || '').toLowerCase();
                        const industry = (company.industry || '').toLowerCase();
                        const type = (company.type || '').toLowerCase();

                        const term = searchTerm.toLowerCase();

                        return (
                            name.includes(term) ||
                            phone.includes(term) ||
                            address.includes(term) ||
                            industry.includes(term) ||
                            type.includes(term)
                        );
                    });

                    showSearchResults(filtered.length, searchTerm);

                const name = document.getElementById('addName').value.trim();
                const type = document.getElementById('addType').value.trim();
                const phone = document.getElementById('addPhone').value.trim();
                const address = document.getElementById('addAddress').value.trim();
                const industry = document.getElementById('addIndustry').value.trim();
                const scale = document.getElementById('addScale').value.trim();
                const capital = document.getElementById('addCapital').value.trim();
                const registration = document.getElementById('addRegistration').value;

                // 验证必填字段
                if (!name || !type || !phone) {
                    alert('请填写企业名称、类型和联系电话！');
                    return;
                }

                try {
                    const companyData = {
                        name,
                        contact: '联系人', // 保留contact字段以兼容现有数据结构
                        type,
                        phone,
                        address: address || '',
                        industry: industry || '泳装相关',
                        scale: scale || '',
                        capital: capital || '',
                        registration: registration || '',
                        province: '',
                        city: '',
                        district: '',
                        registrationStatus: '存续',
                        email: '',
                        website: '',
                        description: '',
                    };

                    await createCompany(companyData);

                    // 清除缓存，确保数据一致性
                    cachedCompanies = null;
                    lastDataLoadTime = null;

                    // 重新渲染表格
                    await renderTable();
                    closeAddModal();

                    alert('企业添加成功！');
                } catch (error) {
                    console.error('添加企业失败:', error);
                    alert('添加企业失败，请重试！');
                }
            }

            // 确认删除企业
            function confirmDelete(companyId, companyName) {
                if (confirm(`确定要删除企业"${companyName}"吗？此操作不可撤销！`)) {
                    deleteCompanyById(companyId);
                }
            }

            // 删除企业
            async function deleteCompanyById(companyId) {
                try {
                    await deleteCompany(companyId);

                    // 清除缓存，确保数据一致性
                    cachedCompanies = null;
                    lastDataLoadTime = null;

                    // 重新渲染表格
                    await renderTable();

                    alert('企业删除成功！');
                } catch (error) {
                    console.error('删除企业失败:', error);
                    alert('删除企业失败，请重试！');
                }
            }

            // 自动刷新相关变量
            let autoRefreshInterval = null;
            let isAutoRefreshEnabled = true;

            // 自动刷新数据
            async function autoRefreshData() {
                if (!isAutoRefreshEnabled) return;

                try {
                    // 显示刷新状态
                    showAutoRefreshStatus(true);

                    // 强制刷新数据，不使用缓存
                    const freshData = await loadData(true);

                    // 重新渲染表格
                    await renderTable(freshData);

                    console.log('数据自动刷新完成:', new Date().toLocaleTimeString());
                } catch (error) {
                    console.error('自动刷新失败:', error);
                } finally {
                    // 隐藏刷新状态
                    showAutoRefreshStatus(false);
                }
            }

            // 显示/隐藏自动刷新状态
            function showAutoRefreshStatus(isRefreshing) {
                let statusElement = document.getElementById('autoRefreshStatus');
                if (!statusElement) {
                    // 创建状态指示器
                    statusElement = document.createElement('div');
                    statusElement.id = 'autoRefreshStatus';
                    statusElement.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: #007bff;
                    color: white;
                    padding: 8px 16px;
                    border-radius: 4px;
                    font-size: 14px;
                    z-index: 1000;
                    display: none;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                `;
                    statusElement.innerHTML = '🔄 正在更新数据...';
                    document.body.appendChild(statusElement);
                }

                statusElement.style.display = isRefreshing ? 'block' : 'none';
            }

            // 启动自动刷新
            function startAutoRefresh() {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                }

                // 每3小时自动刷新一次
                autoRefreshInterval = setInterval(autoRefreshData, 10800000); // 3小时 = 3 * 60 * 60 * 1000 = 10800000毫秒
                isAutoRefreshEnabled = true;
                console.log('自动刷新已启动，每3小时更新一次数据');
            }

            // 停止自动刷新
            function stopAutoRefresh() {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
                isAutoRefreshEnabled = false;
                showAutoRefreshStatus(false);
                console.log('自动刷新已停止');
            }

            // 初始化
            document.addEventListener('DOMContentLoaded', async function () {
                await renderTable();
                setupSearch();

                // 启动自动刷新
                startAutoRefresh();

                // 模态框关闭事件
                document.querySelector('.close').onclick = closeModal;

                window.onclick = function (event) {
                    const modal = document.getElementById('detailModal');
                    if (event.target === modal) {
                        closeModal();
                    }
                };

                // 页面失去焦点时停止自动刷新，获得焦点时重新启动
                document.addEventListener('visibilitychange', function () {
                    if (document.hidden) {
                        stopAutoRefresh();
                    } else {
                        startAutoRefresh();
                    }
                });
            });
        </script>
    </body>
</html>
